name: Android build

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Install NDK and CMake
        run: sdkmanager "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Build and test
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew :core:test :app:testDebugUnitTest :app:assembleDebug --stacktrace 2>&1 | tee gradle.log

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### Gradle log (last 150 lines)'
            echo '```'
            tail -n 150 gradle.log 2>&1 || echo "(no gradle.log: failure happened before the Gradle step)"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY" > report.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -f body="$(cat report.md)" || true

      - uses: actions/upload-artifact@v4
        with:
          name: lyrics-machine-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish latest-debug pre-release
        if: github.ref == 'refs/heads/main'
        run: cp app/build/outputs/apk/debug/app-debug.apk lyrics-machine.apk

      - uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest-debug
          name: Latest debug build
          prerelease: true
          make_latest: false
          files: lyrics-machine.apk
